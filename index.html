<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gallery-container">

  <!-- Main Display -->
  <div class="main-image">
    <button class="nav-btn prev">&#10094;</button>
    <img id="mainImg" src="images/pngegg.png" alt="Product Image">
    <button class="nav-btn next">&#10095;</button>
  </div>

  <!-- Thumbnails -->
  <div class="thumbnails">
    <img src="images/pngegg.png" class="thumb active">
    <img src="images/pngegg (1).png" class="thumb">
    <img src="images/pngegg (2).png" class="thumb">
    <img src="images/pngegg (3).png" class="thumb">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
